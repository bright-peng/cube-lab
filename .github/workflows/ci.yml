name: Test and build Cube Lab

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: cube-lab-offline
          path: dist/index.html
          if-no-files-found: error
          retention-days: 14
